{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Tree Analysis: {{ analysis.name }}</h2>
    <form method="post" id="updateForm">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" name="name" value="{{ analysis.name }}" class="form-control mb-3">

                <!-- ✅ Created At Field -->
                <label class="form-label">Created At</label>
                <input 
                    type="datetime-local" 
                    name="created_at" 
                    id="created_at" 
                    class="form-control mb-3"
                    value="{{ analysis.created_at|date:'Y-m-d\\TH:i' }}"
                    required
                >

                <label class="form-label">Total Leaves</label>
                <input type="number" name="total_leaves" id="total_leaves" value="{{ analysis.total_leaves }}" class="form-control mb-3">

                <label class="form-label">Healthy Count</label>
                <input type="number" name="healthy_count" id="healthy_count" value="{{ analysis.healthy_count }}" class="form-control mb-3">

                <label class="form-label">Dried Leaf Count</label>
                <input type="number" name="dried_leaf_count" id="dried_leaf_count" value="{{ analysis.dried_leaf_count }}" class="form-control mb-3">

                <label class="form-label">Leaf Rust Count</label>
                <input type="number" name="leaf_rust_count" id="leaf_rust_count" value="{{ analysis.leaf_rust_count }}" class="form-control mb-3">

                <label class="form-label">Powdery Mildew Count</label>
                <input type="number" name="powdery_mildew_count" id="powdery_mildew_count" value="{{ analysis.powdery_mildew_count }}" class="form-control mb-3">
            </div>

            <div class="col-md-6">
                <label class="form-label">Healthy Percentage (%)</label>
                <input type="number" step="0.01" name="healthy_percentage" id="healthy_percentage" value="{{ analysis.healthy_percentage }}" class="form-control mb-3" readonly>

                <label class="form-label">Dried Leaf Percentage (%)</label>
                <input type="number" step="0.01" name="dried_leaf_percentage" id="dried_leaf_percentage" value="{{ analysis.dried_leaf_percentage }}" class="form-control mb-3" readonly>

                <label class="form-label">Leaf Rust Percentage (%)</label>
                <input type="number" step="0.01" name="leaf_rust_percentage" id="leaf_rust_percentage" value="{{ analysis.leaf_rust_percentage }}" class="form-control mb-3" readonly>

                <label class="form-label">Powdery Mildew Percentage (%)</label>
                <input type="number" step="0.01" name="powdery_mildew_percentage" id="powdery_mildew_percentage" value="{{ analysis.powdery_mildew_percentage }}" class="form-control mb-3" readonly>

                <label class="form-label">Overall Health (%)</label>
                <input type="number" step="0.01" name="overall_health" id="overall_health" value="{{ analysis.overall_health }}" class="form-control mb-3" readonly>

                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="4">{{ analysis.notes }}</textarea>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'tree_analysis_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function calculateHealth() {
    const total = parseFloat(document.getElementById('total_leaves').value) || 0;
    const healthy = parseFloat(document.getElementById('healthy_count').value) || 0;
    const dried = parseFloat(document.getElementById('dried_leaf_count').value) || 0;
    const rust = parseFloat(document.getElementById('leaf_rust_count').value) || 0;
    const mildew = parseFloat(document.getElementById('powdery_mildew_count').value) || 0;

    if (total > 0) {
        const healthyPct = (healthy / total) * 100;
        const driedPct = (dried / total) * 100;
        const rustPct = (rust / total) * 100;
        const mildewPct = (mildew / total) * 100;

        document.getElementById('healthy_percentage').value = healthyPct.toFixed(2);
        document.getElementById('dried_leaf_percentage').value = driedPct.toFixed(2);
        document.getElementById('leaf_rust_percentage').value = rustPct.toFixed(2);
        document.getElementById('powdery_mildew_percentage').value = mildewPct.toFixed(2);

        // same weighted formula as your model:
        const overall = (healthyPct * 1) + (mildewPct * 0.6) + (rustPct * 0.2);
        document.getElementById('overall_health').value = overall.toFixed(2);
    } else {
        document.getElementById('healthy_percentage').value = 0;
        document.getElementById('dried_leaf_percentage').value = 0;
        document.getElementById('leaf_rust_percentage').value = 0;
        document.getElementById('powdery_mildew_percentage').value = 0;
        document.getElementById('overall_health').value = 0;
    }
}

// Recalculate whenever counts or total change
document.querySelectorAll('#total_leaves, #healthy_count, #dried_leaf_count, #leaf_rust_count, #powdery_mildew_count')
    .forEach(el => el.addEventListener('input', calculateHealth));
</script>
{% endblock %}
